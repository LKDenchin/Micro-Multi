<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#152422">
  <title>MASP · 工程工作台</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="#dashboard"><span class="brand-mark">m<span>·</span></span><div>MASP<small>ENGINEERING WORKSPACE</small></div></a>
    <div class="workspace-label"><span class="workspace-avatar">L</span><div>Local workspace<small>本地工程空间</small></div><span class="local-dot"></span></div>
    <div class="nav-heading">工作空间</div>
    <nav aria-label="主导航">
      <a href="#dashboard" data-nav="dashboard"><span data-icon="grid"></span>总览</a>
      <a href="#projects" data-nav="projects"><span data-icon="folder"></span>项目<span id="project-count" class="nav-count">0</span></a>
      <a href="#runs" data-nav="runs"><span data-icon="activity"></span>运行记录</a>
      <a href="#artifacts" data-nav="artifacts"><span data-icon="box"></span>工程产物</a>
    </nav>
    <div class="nav-heading recent-label">最近项目</div><div id="recent-projects"></div>
    <div class="sidebar-bottom"><div class="engine-status"><span class="local-dot"></span>编排服务在线</div><a href="/docs" target="_blank" rel="noreferrer">API 文档 <span>↗</span></a><small>MASP / v0.1.0</small></div>
  </aside>
  <div class="main-wrap">
    <header class="topbar"><div><span class="muted">工作空间</span><span class="slash">/</span><span id="breadcrumb">总览</span></div><div class="topbar-right"><span class="environment">LOCAL</span><span class="avatar">ME</span></div></header>
    <main id="content" tabindex="-1"><div class="loading">正在连接工作空间…</div></main>
    <footer>Contract first. Evidence driven.<span>本地数据 · 独立工作区 · 可追溯执行</span></footer>
  </div>
  <dialog id="project-dialog">
    <form id="project-form"><div class="dialog-heading"><div><span class="eyebrow">NEW PROJECT</span><h2>创建工程项目</h2></div><button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭">×</button></div>
      <label>项目名称<input name="name" required maxlength="80" placeholder="例如：calculator-service"></label>
      <label>项目说明<textarea name="description" rows="2" placeholder="这个项目要解决什么问题？"></textarea></label>
      <label>项目来源<select name="source"><option value="new">创建新 Git 仓库</option><option value="import">导入本地 Git 仓库（复制已提交历史）</option></select></label>
      <label id="repo-label" hidden>本地仓库绝对路径<input name="repository" placeholder="D:\projects\my-app"></label>
      <label>执行模式<select name="provider"><option value="fixture">内置验收示例 · 无需模型密钥</option><option value="openai-compatible">真实模型 · OpenAI-compatible API + Docker</option></select></label>
      <p class="form-hint">内置示例固定构建算术库，用于验证并行开发、测试失败与自动修复。真实需求开发需在服务端配置模型和 Docker。</p>
      <div class="form-error" role="alert"></div><button class="button primary full" type="submit">创建项目 <span>→</span></button>
    </form>
  </dialog>
  <dialog id="run-dialog">
    <form id="run-form"><div class="dialog-heading"><div><span class="eyebrow">START A RUN</span><h2>描述你的工程目标</h2></div><button type="button" class="icon-button" data-action="close-dialog" aria-label="关闭">×</button></div>
      <label>需求说明<textarea name="requirement" required minlength="5" maxlength="16000" rows="5" placeholder="描述需要实现的功能、约束和验收标准…"></textarea></label>
      <div class="form-row"><label>并发 Agent<select name="max_agents"><option>2</option><option>3</option><option>4</option><option>1</option></select></label><label>最大修复次数<select name="max_retries"><option>3</option><option>2</option><option>1</option><option>0</option></select></label></div>
      <label class="checkbox"><input type="checkbox" name="inject_failure">注入一次示例测试失败，验证自动修复流程</label>
      <label class="checkbox"><input type="checkbox" name="approve_contract_change">批准本次契约变更（共享接口变更时才使用）</label>
      <p id="run-mode-hint" class="form-hint"></p><div class="form-error" role="alert"></div>
      <button class="button primary full" type="submit">开始工程运行 <span>→</span></button>
    </form>
  </dialog>
  <div id="toast" role="status"></div>
</body>
</html>
