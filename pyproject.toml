[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "masp-workspace"
version = "0.1.0"
description = "An observable, contract-driven multi-agent engineering workspace"
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "mypy>=1.15,<3", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
masp = "masp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
masp = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/masp"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
