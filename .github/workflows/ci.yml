name: verify
on: [push, pull_request]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check src tests scripts
      - run: python -m ruff format --check src tests scripts
      - run: python -m mypy src/masp
      - run: python -m pytest -q
      - run: npm run test:plugin-client
      - run: npm run test:chat-startup
      - run: node tests/client_dependencies.test.mjs
      - run: python -m pip install -r requirements-site.txt
      - run: python scripts/build_site.py
      - run: python scripts/verify_site.py
      - run: python -m build
      - run: python scripts/publication_audit.py
