name: Bug report / 问题报告
description: Report a reproducible problem; redact credentials and personal content.
body:
  - type: input
    id: version
    attributes:
      label: Version and operating system / 版本与系统
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce / 复现步骤
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior / 预期与实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs / 脱敏日志
      description: Remove API keys, private paths, conversations and project contents.
