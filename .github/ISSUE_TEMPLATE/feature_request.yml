name: Feature request / 功能建议
description: Suggest an improvement to Micro-Multi / 提出改进建议
body:
  - type: textarea
    id: problem
    attributes:
      label: Use case / 使用场景
      description: Describe the task you want to accomplish / 描述你希望完成的任务
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 期望行为
      description: Explain how the feature would help / 说明功能如何帮助完成任务
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and context / 替代方案与补充信息
